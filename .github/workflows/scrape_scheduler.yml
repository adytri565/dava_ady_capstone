name: Automated Web Scraping

on:
  schedule:
    # Berjalan otomatis setiap 5 jam
    - cron: '0 */5 * * *'
  workflow_dispatch: # Bisa dijalankan manual juga dari tab Actions di GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraping-service/requirements.txt

      - name: Run Scraper Script
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }} # Simpan connection string MongoDB Atlas Anda di GitHub Secrets
        run: |
          python scraping-service/app.py # Atau buat script runner khusus untuk eksekusi sekali jalan