{% extends "base.html" %}
{% block content %}

<!-- Library Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="p-6 bg-[#12141C] min-h-screen text-gray-200">
    <div class="mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold">📊 Analitik Volume Berita Scraping</h1>
            <p class="text-sm text-gray-400">Diagram distribusi jumlah berita dan judul berdasarkan waktu pencatatan.</p>
        </div>
        <a href="/scraping-view" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition">⬅️ Kembali ke Control Panel</a>
    </div>

    <!-- KARTU DIAGRAM BATANG -->
    <div class="bg-[#1E2230] p-6 rounded-2xl border border-gray-800 shadow-xl">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-gray-200">Grafik Berita Scraping per Tanggal</h3>
            <button onclick="loadScrapingChart()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg transition font-semibold">🔄 Refresh Grafik</button>
        </div>
        <div class="relative h-96 w-full">
            <canvas id="scrapingDateChart"></canvas>
        </div>
    </div>
</div>

<script>
    let scrapingChartInstance = null;

    function loadScrapingChart() {
        // Ambil data dari API scraping data
        fetch('http://127.0.0.1:4000/api/scrape/data')
            .then(res => res.json())
            .then(result => {
                let dataArray = Array.isArray(result) ? result : (result.data || []);
                
                if (dataArray.length > 0) {
                    // Kelompokkan data berdasarkan Tanggal (mengambil format YYYY-MM-DD saja)
                    let dateCounts = {};
                    let dateTitles = {};

                    dataArray.forEach(item => {
                        let rawDate = item.date || item.timestamp || 'Unknown';
                        let dateOnly = rawDate.split(' ')[0]; // Ambil tanggalnya saja
                        
                        dateCounts[dateOnly] = (dateCounts[dateOnly] || 0) + 1;
                        
                        if (!dateTitles[dateOnly]) dateTitles[dateOnly] = [];
                        dateTitles[dateOnly].push(item.title_cleaned || item.title);
                    });

                    let labels = Object.keys(dateCounts);
                    let values = Object.values(dateCounts);

                    const ctx = document.getElementById('scrapingDateChart').getContext('2d');
                    
                    if (scrapingChartInstance != null) {
                        scrapingChartInstance.destroy();
                    }

                    scrapingChartInstance = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels, // Sumbu X: Tanggal
                            datasets: [{
                                label: 'Jumlah Judul Berita',
                                data: values, // Sumbu Y: Total Berita di tanggal tersebut
                                backgroundColor: 'rgba(54, 162, 235, 0.8)',
                                borderColor: 'rgba(54, 162, 235, 1)',
                                borderWidth: 1,
                                borderRadius: 8,
                                barPercentage: 0.5
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                 callbacks: {
                                     title: function(context) {
                                         return 'Tanggal: ' + context[0].label;
                                     },
                                     label: function(context) {
                                         return ' Total Berita: ' + context.raw + ' dokumen';
                                     }
                                 }
                                }
                            },
                            scales: {
                                y: { 
                                    beginAtZero: true,
                                    ticks: { precision: 0, color: '#9ca3af' },
                                    grid: { color: 'rgba(255, 255, 255, 0.05)' }
                                },
                                x: {
                                    ticks: { color: '#9ca3af' },
                                    grid: { display: false }
                                }
                            }
                        }
                    });
                }
            })
            .catch(err => console.error("Gagal memuat grafik scraping:", err));
    }

    // Jalankan fungsi saat halaman dibuka
    loadScrapingChart();
</script>
{% endblock %}
